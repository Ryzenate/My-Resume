<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nathan Fritsche – Resume</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f9fc;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
      color: #1a4b8c;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .download-btn {
      display: inline-block;
      padding: 14px 28px;
      background: #1a4b8c;
      color: #fff;
      text-decoration: none;
      font-size: 1.1rem;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    .download-btn:hover {
      background: #163f75;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #666;
    }

    .footer a {
      color: #1a4b8c;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>My Resume</h1>

    <p>
      Thanks for visiting! You can download my full resume using the link below.
      It's provided in Word DOCX format for easy viewing and printing.
    </p>

    <a class="download-btn" href="/pages/media/resumes/nf.docx" download>
      Download Resume (DOCX)
    </a>

    <div class="footer">
      <p>
        Prefer to explore my work online?  
        Visit my portfolio site:  
        <a href="https://www.micronate.com">www.micronate.com</a>
      </p>
    </div>
  </div>
</body>
</html>
