<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume – Nathan Fritsche</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .wrapper {
      max-width: 900px;
      margin: 80px auto;
      background: #fff;
      padding: 50px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 2.2rem;
      font-weight: 600;
      color: #222;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.6;
      margin: 20px 0 35px;
    }

    a.download {
      display: inline-block;
      padding: 14px 32px;
      background: #2b4c7e;
      color: #fff;
      text-decoration: none;
      font-size: 1.1rem;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    a.download:hover {
      background: #1f3a61;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.95rem;
      color: #666;
    }

    .footer a {
      color: #2b4c7e;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <h1>Resume</h1>

    <p>
      You can download my full resume below.  
      It's provided in Word DOCX format for easy viewing and printing.
    </p>

    <a class="download" href="/pages/media/resumes/nf.docx" download>
      Download Resume (DOCX)
    </a>

    <div class="footer">
      <p>
        Want to explore my work online instead?  
        Visit my main site: <a href="https://www.micronate.com">micronate.com</a>
      </p>
    </div>
  </div>
</body>
</html>
